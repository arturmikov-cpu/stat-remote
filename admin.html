<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пульт управления матчем</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }
        
        .teams-config { display: flex; gap: 20px; margin-bottom: 30px; }
        .team-input { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        input[type="text"] { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; }
        input[type="file"] { font-size: 14px; }
        .logo-preview { max-width: 60px; max-height: 60px; border-radius: 50%; border: 2px solid #333; object-fit: cover; display: none; align-self: flex-start; }

        .block-title { font-size: 18px; font-weight: bold; color: #555; margin: 30px 0 15px; border-bottom: 2px solid #eee; padding-bottom: 10px; }

        .control-row { display: grid; grid-template-columns: 1fr 1.5fr 1fr; align-items: center; margin-bottom: 15px; padding: 10px; background: #f9f9f9; border-radius: 8px; }
        .team-ctrl { display: flex; align-items: center; gap: 10px; justify-content: center; }
        .team-ctrl.left { justify-content: flex-end; }
        .team-ctrl.right { justify-content: flex-start; }
        
        .val { font-size: 24px; font-weight: bold; min-width: 40px; text-align: center; color: #333; }
        .val.score { font-size: 32px; color: #000; }
        .val.poss { font-size: 20px; color: #555; }
        
        button { padding: 8px 15px; font-size: 18px; border: none; border-radius: 6px; cursor: pointer; transition: filter 0.2s; font-weight: bold; }
        .btn-plus { background: #28a745; color: white; }
        .btn-minus { background: #dc3545; color: white; }
        button:hover { filter: brightness(1.1); }

        .label-center { text-align: center; font-weight: bold; color: #666; text-transform: uppercase; font-size: 14px; letter-spacing: 1px; }

        .overlay-link { margin-top: 30px; text-align: center; font-size: 14px; color: #666; background: #eef; padding: 15px; border-radius: 8px; }
        .overlay-link a { color: #007bff; text-decoration: none; font-weight: bold; word-break: break-all; }

        .btn-reset-all { width: 100%; padding: 15px; font-size: 18px; background: #ffc107; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; transition: background 0.2s; }
        .btn-reset-all:hover { background: #e0a800; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Пульт администратора</h1>
        
        <div class="teams-config">
            <div class="team-input">
                <label><b>Хозяева:</b></label>
                <input type="text" id="homeName" placeholder="Название команды">
                <label>Логотип (файл):</label>
                <input type="file" id="homeLogoFile" accept="image/*">
                <img id="homeLogoPreview" class="logo-preview" src="">
            </div>
            <div class="team-input">
                <label><b>Гости:</b></label>
                <input type="text" id="awayName" placeholder="Название команды">
                <label>Логотип (файл):</label>
                <input type="file" id="awayLogoFile" accept="image/*">
                <img id="awayLogoPreview" class="logo-preview" src="">
            </div>
        </div>

        <!-- СЧЁТ -->
        <div class="block-title">Счёт матча</div>
        <div class="control-row">
            <div class="team-ctrl left">
                <button class="btn-minus" data-action="score" data-team="home">-</button>
                <div class="val score" id="homeScore">0</div>
                <button class="btn-plus" data-action="score" data-team="home">+</button>
            </div>
            <div class="label-center">ГОЛЫ</div>
            <div class="team-ctrl right">
                <button class="btn-minus" data-action="score" data-team="away">-</button>
                <div class="val score" id="awayScore">0</div>
                <button class="btn-plus" data-action="score" data-team="away">+</button>
            </div>
        </div>

        <!-- ВЛАДЕНИЕ -->
        <div class="block-title">Владение мячом (%)</div>
        <div class="control-row">
            <div class="team-ctrl left">
                <button class="btn-minus" data-action="poss" data-team="home">-</button>
                <div class="val poss" id="homePoss">50%</div>
                <button class="btn-plus" data-action="poss" data-team="home">+</button>
            </div>
            <div class="label-center">ВЛАДЕНИЕ</div>
            <div class="team-ctrl right">
                <button class="btn-minus" data-action="poss" data-team="away">-</button>
                <div class="val poss" id="awayPoss">50%</div>
                <button class="btn-plus" data-action="poss" data-team="away">+</button>
            </div>
        </div>

        <!-- СТАТИСТИКА -->
        <div class="block-title">Статистика</div>
        <div id="statsContainer"></div>

        <button id="resetAllBtn" class="btn-reset-all">Сбросить всю статистику и данные</button>

        <div class="overlay-link">
            Ссылка для OBS (Browser Source):<br>
            <a href="overlay.html" target="_blank">https://arturmikov-cpu.github.io/stat-remote/overlay.html</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCxRWPH50Jl-K290hLikKZAA41qeuP8s9c",
            authDomain: "stat-remote.firebaseapp.com",
            databaseURL: "https://stat-remote-default-rtdb.firebaseio.com",
            projectId: "stat-remote",
            storageBucket: "stat-remote.firebasestorage.app",
            messagingSenderId: "702880337194",
            appId: "1:702880337194:web:fc1b4db5fdfbbdb9416253",
            measurementId: "G-7S554X0ZVQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const statsConfig = [
            { key: 'shots', label: 'Удары' },
            { key: 'fouls', label: 'Нарушения' },
            { key: 'offsides', label: 'Оффсайды' },
            { key: 'corners', label: 'Угловые' },
            { key: 'yellowCards', label: 'Жёлтые' },
            { key: 'redCards', label: 'Красные' }
        ];

        const statsContainer = document.getElementById('statsContainer');

        // Генерация строк статистики
        statsConfig.forEach(stat => {
            const row = document.createElement('div');
            row.className = 'control-row';
            row.innerHTML = `
                <div class="team-ctrl left">
                    <button class="btn-minus" data-action="stat" data-stat="${stat.key}" data-team="home">-</button>
                    <div class="val" id="home-${stat.key}">0</div>
                    <button class="btn-plus" data-action="stat" data-stat="${stat.key}" data-team="home">+</button>
                </div>
                <div class="label-center">${stat.label}</div>
                <div class="team-ctrl right">
                    <button class="btn-minus" data-action="stat" data-stat="${stat.key}" data-team="away">-</button>
                    <div class="val" id="away-${stat.key}">0</div>
                    <button class="btn-plus" data-action="stat" data-stat="${stat.key}" data-team="away">+</button>
                </div>
            `;
            statsContainer.appendChild(row);
        });

        // Обработка кликов
        document.body.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON') return;
            
            const action = e.target.dataset.action;
            const team = e.target.dataset.team;
            const isPlus = e.target.classList.contains('btn-plus');
            const delta = isPlus ? 1 : -1;

            if (action === 'score') {
                const currentVal = parseInt(document.getElementById(`${team}Score`).innerText) || 0;
                update(ref(db, 'match'), { [`${team}Score`]: Math.max(0, currentVal + delta) });
            } 
            else if (action === 'stat') {
                const statKey = e.target.dataset.stat;
                const currentVal = parseInt(document.getElementById(`${team}-${statKey}`).innerText) || 0;
                update(ref(db, `match/stats/${statKey}`), { [team]: Math.max(0, currentVal + delta) });
            } 
            else if (action === 'poss') {
                let homeVal = parseInt(document.getElementById('homePoss').innerText) || 50;
                let awayVal = 100 - homeVal;
                if (team === 'home') {
                    homeVal = Math.max(0, Math.min(100, homeVal + delta));
                    awayVal = 100 - homeVal;
                } else {
                    awayVal = Math.max(0, Math.min(100, awayVal + delta));
                    homeVal = 100 - awayVal;
                }
                update(ref(db, 'match/possession'), { home: homeVal, away: awayVal });
            }
        });

        // Сброс всей статистики
        document.getElementById('resetAllBtn').addEventListener('click', () => {
            if (confirm('Вы уверены, что хотите сбросить ВСЮ статистику, счет, владение, названия и логотипы команд?')) {
                remove(ref(db, 'match'));
            }
        });

        // Обработка ввода названий
        document.body.addEventListener('input', (e) => {
            if (e.target.id === 'homeName') update(ref(db, 'match'), { homeTeam: e.target.value });
            if (e.target.id === 'awayName') update(ref(db, 'match'), { awayTeam: e.target.value });
        });

        // Загрузка логотипов файлом (Base64)
        function handleLogoUpload(inputId, teamKey) {
            document.getElementById(inputId).addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    update(ref(db, 'match'), { [`${teamKey}Logo`]: ev.target.result });
                };
                reader.readAsDataURL(file);
            });
        }
        handleLogoUpload('homeLogoFile', 'home');
        handleLogoUpload('awayLogoFile', 'away');

        // Синхронизация с БД
        const matchRef = ref(db, 'match');
        onValue(matchRef, (snapshot) => {
            const data = snapshot.val();
            
            // Если данные стерты (сброс), возвращаем UI в исходное состояние
            if (!data) {
                document.getElementById('homeName').value = '';
                document.getElementById('awayName').value = '';
                document.getElementById('homeLogoFile').value = '';
                document.getElementById('awayLogoFile').value = '';
                document.getElementById('homeLogoPreview').style.display = 'none';
                document.getElementById('awayLogoPreview').style.display = 'none';
                
                document.getElementById('homeScore').innerText = '0';
                document.getElementById('awayScore').innerText = '0';
                document.getElementById('homePoss').innerText = '50%';
                document.getElementById('awayPoss').innerText = '50%';
                
                statsConfig.forEach(stat => {
                    document.getElementById(`home-${stat.key}`).innerText = '0';
                    document.getElementById(`away-${stat.key}`).innerText = '0';
                });
                return;
            }

            if (data.homeTeam !== undefined) document.getElementById('homeName').value = data.homeTeam || '';
            if (data.awayTeam !== undefined) document.getElementById('awayName').value = data.awayTeam || '';

            const homePrev = document.getElementById('homeLogoPreview');
            if (data.homeLogo) { homePrev.src = data.homeLogo; homePrev.style.display = 'block'; } else { homePrev.style.display = 'none'; }
            const awayPrev = document.getElementById('awayLogoPreview');
            if (data.awayLogo) { awayPrev.src = data.awayLogo; awayPrev.style.display = 'block'; } else { awayPrev.style.display = 'none'; }

            if (data.homeScore !== undefined) document.getElementById('homeScore').innerText = data.homeScore;
            if (data.awayScore !== undefined) document.getElementById('awayScore').innerText = data.awayScore;

            const homePoss = data.possession?.home ?? 50;
            const awayPoss = data.possession?.away ?? 50;
            document.getElementById('homePoss').innerText = homePoss + '%';
            document.getElementById('awayPoss').innerText = awayPoss + '%';

            if (data.stats) {
                statsConfig.forEach(stat => {
                    document.getElementById(`home-${stat.key}`).innerText = data.stats[stat.key]?.home || 0;
                    document.getElementById(`away-${stat.key}`).innerText = data.stats[stat.key]?.away || 0;
                });
            } else {
                // Если узел stats пустой, обнуляем значения
                statsConfig.forEach(stat => {
                    document.getElementById(`home-${stat.key}`).innerText = '0';
                    document.getElementById(`away-${stat.key}`).innerText = '0';
                });
            }
        });
    </script>
</body>
</html>
