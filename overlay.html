<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Football Overlay — Live</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: transparent;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .overlay-container {
            width: 700px;
            background-color: rgba(15, 23, 20, 0.85);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            padding: 25px;
            backdrop-filter: blur(5px);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Шапка со счётом */
        .header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 20px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 20px;
            margin-bottom: 15px;
        }

        .team-block {
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 0;
        }

        .team-block.right { justify-content: flex-end; }

        .logo-container {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background-color: #333;
            border: 2px solid #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .team-name {
            font-size: 24px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }

        .score-block {
            font-size: 40px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .score-item {
            background: #fff;
            color: #000;
            padding: 2px 12px;
            border-radius: 6px;
            min-width: 45px;
            text-align: center;
            transition: all 0.3s;
        }

        .score-item.goal-flash {
            animation: goalFlash 1.5s ease;
        }

        @keyframes goalFlash {
            0% { transform: scale(1); background: #4caf50; color: white; }
            50% { transform: scale(1.3); background: #4caf50; color: white; }
            100% { transform: scale(1); background: #fff; color: #000; }
        }

        /* Таймер */
        .timer-bar {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }

        .timer {
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 20px;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }

        /* Статистика */
        .stats-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .stat-row {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            align-items: center;
            padding: 10px 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-row:last-child { border-bottom: none; }

        .stat-home, .stat-away {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            transition: all 0.3s;
        }

        .stat-home { color: #4caf50; }
        .stat-away { color: #2196f3; }

        .stat-value-changed {
            animation: statPulse 0.5s ease;
        }

        @keyframes statPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); color: white; }
            100% { transform: scale(1); }
        }

        .stat-label {
            font-size: 16px;
            color: #ccc;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 1px;
        }

        /* Владение */
        .possession-block {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid rgba(255, 255, 255, 0.2);
        }

        .possession-label {
            color: #ccc;
            font-size: 14px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 8px;
        }

        .possession-labels {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 18px;
        }

        .possession-labels .home { color: #4caf50; }
        .possession-labels .away { color: #2196f3; }

        .possession-bar {
            width: 100%;
            height: 10px;
            background: #444;
            border-radius: 5px;
            overflow: hidden;
            display: flex;
        }

        .possession-home {
            background: #4caf50;
            height: 100%;
            transition: width 0.5s ease;
        }

        .possession-away {
            background: #2196f3;
            height: 100%;
            transition: width 0.5s ease;
        }

        /* Индикатор подключения */
        .status-dot {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }

        .status-dot.disconnected { background: #f44336; }
    </style>
</head>
<body>
    <div class="status-dot" id="statusDot"></div>

    <div class="overlay-container">
        <!-- Шапка матча -->
        <div class="header">
            <div class="team-block">
                <div class="logo-container">
                    <img id="homeLogoImg" src="" style="display:none;">
                    <span id="homeLogoText" style="font-size:9px;color:#aaa;">Лого</span>
                </div>
                <div class="team-name" id="homeTeamName">Хозяева</div>
            </div>

            <div class="score-block">
                <div class="score-item" id="homeScore">0</div>
                <span>:</span>
                <div class="score-item" id="awayScore">0</div>
            </div>

            <div class="team-block right">
                <div class="team-name" id="awayTeamName">Гости</div>
                <div class="logo-container">
                    <img id="awayLogoImg" src="" style="display:none;">
                    <span id="awayLogoText" style="font-size:9px;color:#aaa;">Лого</span>
                </div>
            </div>
        </div>

        <!-- Таймер -->
        <div class="timer-bar">
            <div class="timer" id="matchTimer">00:00</div>
        </div>

        <!-- Статистика -->
        <div class="stats-container" id="statsContainer">
            <div class="stat-row">
                <div class="stat-home" id="stat_shots_home">0</div>
                <div class="stat-label">Удары</div>
                <div class="stat-away" id="stat_shots_away">0</div>
            </div>
            <div class="stat-row">
                <div class="stat-home" id="stat_fouls_home">0</div>
                <div class="stat-label">Нарушения</div>
                <div class="stat-away" id="stat_fouls_away">0</div>
            </div>
            <div class="stat-row">
                <div class="stat-home" id="stat_offsides_home">0</div>
                <div class="stat-label">Оффсайды</div>
                <div class="stat-away" id="stat_offsides_away">0</div>
            </div>
            <div class="stat-row">
                <div class="stat-home" id="stat_corners_home">0</div>
                <div class="stat-label">Угловые</div>
                <div class="stat-away" id="stat_corners_away">0</div>
            </div>
            <div class="stat-row">
                <div class="stat-home" id="stat_yellowCards_home">0</div>
                <div class="stat-label">Жёлтые</div>
                <div class="stat-away" id="stat_yellowCards_away">0</div>
            </div>
            <div class="stat-row">
                <div class="stat-home" id="stat_redCards_home">0</div>
                <div class="stat-label">Красные</div>
                <div class="stat-away" id="stat_redCards_away">0</div>
            </div>
        </div>

        <!-- Владение мячом -->
        <div class="possession-block">
            <div class="possession-label">Владение мячом</div>
            <div class="possession-labels">
                <span class="home" id="possHomeVal">50%</span>
                <span class="away" id="possAwayVal">50%</span>
            </div>
            <div class="possession-bar">
                <div class="possession-home" id="possHomeBar" style="width:50%"></div>
                <div class="possession-away" id="possAwayBar" style="width:50%"></div>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        // Инициализация Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const matchRef = db.ref('match');

        let previousState = {};

        // ===== ОСНОВНОЙ СЛУШАТЕЛЬ =====
        matchRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            // Обновляем команды
            if (data.homeTeam) document.getElementById('homeTeamName').textContent = data.homeTeam;
            if (data.awayTeam) document.getElementById('awayTeamName').textContent = data.awayTeam;

            // Логотипы
            if (data.homeLogo) {
                const img = document.getElementById('homeLogoImg');
                img.src = data.homeLogo;
                img.style.display = 'block';
                document.getElementById('homeLogoText').style.display = 'none';
            }
            if (data.awayLogo) {
                const img = document.getElementById('awayLogoImg');
                img.src = data.awayLogo;
                img.style.display = 'block';
                document.getElementById('awayLogoText').style.display = 'none';
            }

            // Счёт с анимацией гола
            if (data.homeScore !== undefined) {
                const el = document.getElementById('homeScore');
                const oldVal = previousState.homeScore || 0;
                el.textContent = data.homeScore;
                if (data.homeScore > oldVal) {
                    el.classList.add('goal-flash');
                    setTimeout(() => el.classList.remove('goal-flash'), 1600);
                }
            }

            if (data.awayScore !== undefined) {
                const el = document.getElementById('awayScore');
                const oldVal = previousState.awayScore || 0;
                el.textContent = data.awayScore;
                if (data.awayScore > oldVal) {
                    el.classList.add('goal-flash');
                    setTimeout(() => el.classList.remove('goal-flash'), 1600);
                }
            }

            // Таймер
            if (data.timer) {
                updateTimerDisplay(data.timer.seconds || 0);
            }

            // Статистика
            if (data.stats) {
                const statKeys = ['shots', 'fouls', 'offsides', 'corners', 'yellowCards', 'redCards'];
                statKeys.forEach(key => {
                    if (data.stats[key]) {
                        const homeEl = document.getElementById(`stat_${key}_home`);
                        const awayEl = document.getElementById(`stat_${key}_away`);
                        const oldHome = previousState.stats?.[key]?.home || 0;
                        const oldAway = previousState.stats?.[key]?.away || 0;

                        if (homeEl) {
                            homeEl.textContent = data.stats[key].home || 0;
                            if (data.stats[key].home > oldHome) {
                                homeEl.classList.add('stat-value-changed');
                                setTimeout(() => homeEl.classList.remove('stat-value-changed'), 500);
                            }
                        }

                        if (awayEl) {
                            awayEl.textContent = data.stats[key].away || 0;
                            if (data.stats[key].away > oldAway) {
                                awayEl.classList.add('stat-value-changed');
                                setTimeout(() => awayEl.classList.remove('stat-value-changed'), 500);
                            }
                        }
                    }
                });
            }

            // Владение
            if (data.possession) {
                const home = data.possession.home || 50;
                const away = data.possession.away || 50;
                document.getElementById('possHomeVal').textContent = home + '%';
                document.getElementById('possAwayVal').textContent = away + '%';
                document.getElementById('possHomeBar').style.width = home + '%';
                document.getElementById('possAwayBar').style.width = away + '%';
            }

            // Сохраняем предыдущее состояние
            previousState = JSON.parse(JSON.stringify(data));
        });

        // Обработка отключения
        matchRef.on('child_removed', () => {
            // База очищена
        });

        // ===== ТАЙМЕР (локальный тик) =====
        let lastKnownSeconds = 0;
        let isTimerRunning = false;
        let localTimerInterval = null;

        function updateTimerDisplay(seconds) {
            lastKnownSeconds = seconds;
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('matchTimer').textContent = `${mins}:${secs}`;
        }

        // Слушаем изменения таймера отдельно для более плавного обновления
        matchRef.child('timer').on('value', (snapshot) => {
            const timerData = snapshot.val();
            if (timerData) {
                if (timerData.running && !isTimerRunning) {
                    // Таймер запущен — стартуем локальный интервал
                    isTimerRunning = true;
                    if (localTimerInterval) clearInterval(localTimerInterval);
                    localTimerInterval = setInterval(() => {
                        lastKnownSeconds++;
                        const mins = Math.floor(lastKnownSeconds / 60).toString().padStart(2, '0');
                        const secs = (lastKnownSeconds % 60).toString().padStart(2, '0');
                        document.getElementById('matchTimer').textContent = `${mins}:${secs}`;
                    }, 1000);
                } else if (!timerData.running && isTimerRunning) {
                    // Таймер остановлен
                    isTimerRunning = false;
                    if (localTimerInterval) clearInterval(localTimerInterval);
                }
                updateTimerDisplay(timerData.seconds || 0);
            }
        });

        // ===== СОСТОЯНИЕ ПОДКЛЮЧЕНИЯ =====
        db.ref('.info/connected').on('value', (snap) => {
            const dot = document.getElementById('statusDot');
            if (snap.val() === true) {
                dot.classList.remove('disconnected');
            } else {
                dot.classList.add('disconnected');
            }
        });
    </script>
</body>
</html>
