<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Football Overlay — Live</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: transparent;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .overlay-container {
            width: 700px;
            background-color: rgba(15, 23, 20, 0.85);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            padding: 25px;
            backdrop-filter: blur(5px);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 20px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 20px;
            margin-bottom: 15px;
        }

        .team-block { display: flex; align-items: center; gap: 15px; min-width: 0; }
        .team-block.right { justify-content: flex-end; }

        .logo-container {
            width: 55px; height: 55px; border-radius: 50%; background-color: #333;
            border: 2px solid #fff; display: flex; justify-content: center; align-items: center;
            overflow: hidden; flex-shrink: 0;
        }
        .logo-container img { width: 100%; height: 100%; object-fit: cover; }

        .team-name {
            font-size: 24px; font-weight: bold; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis; max-width: 220px;
        }

        .score-block { font-size: 40px; font-weight: 900; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .score-item {
            background: #fff; color: #000; padding: 2px 12px; border-radius: 6px;
            min-width: 45px; text-align: center; transition: all 0.3s;
        }
        .score-item.goal-flash { animation: goalFlash 1.5s ease; }

        @keyframes goalFlash {
            0% { transform: scale(1); background: #fff; color: #000; }
            50% { transform: scale(1.3); background: #4caf50; color: white; }
            100% { transform: scale(1); background: #fff; color: #000; }
        }

        .stats-container { display: flex; flex-direction: column; gap: 5px; }
        .stat-row {
            display: grid; grid-template-columns: 1fr 1.5fr 1fr; align-items: center;
            padding: 10px 5px; border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .stat-row:last-child { border-bottom: none; }

        .stat-home, .stat-away { font-size: 22px; font-weight: bold; text-align: center; transition: color 0.3s; }
        .stat-home { color: #4caf50; }
        .stat-away { color: #2196f3; }
        .stat-value-changed { animation: statPulse 0.5s ease; }

        @keyframes statPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); color: white; }
            100% { transform: scale(1); }
        }

        .stat-label { font-size: 16px; color: #ccc; text-transform: uppercase; text-align: center; letter-spacing: 1px; }

        .possession-block { margin-top: 15px; padding-top: 15px; border-top: 2px solid rgba(255, 255, 255, 0.2); }
        .possession-label { color: #ccc; font-size: 14px; text-transform: uppercase; text-align: center; margin-bottom: 8px; }
        .possession-labels { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: bold; font-size: 18px; }
        .possession-labels .home { color: #4caf50; }
        .possession-labels .away { color: #2196f3; }

        .possession-bar { width: 100%; height: 10px; background: #444; border-radius: 5px; overflow: hidden; display: flex; }
        .possession-home { background: #4caf50; height: 100%; transition: width 0.5s ease; }
        .possession-away { background: #2196f3; height: 100%; transition: width 0.5s ease; }

        .status-dot {
            position: fixed; top: 10px; right: 10px; width: 8px; height: 8px;
            border-radius: 50%; background: #4caf50; animation: blink 2s infinite;
        }
        @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0.3; } }
        .status-dot.disconnected { background: #f44336; }
    </style>
</head>
<body>
    <div class="status-dot" id="statusDot"></div>

    <div class="overlay-container">
        <div class="header">
            <div class="team-block">
                <div class="logo-container">
                    <img id="homeLogoImg" src="" style="display:none;">
                    <span id="homeLogoText" style="font-size:9px;color:#aaa;">Лого</span>
                </div>
                <div class="team-name" id="homeTeamName">Хозяева</div>
            </div>

            <div class="score-block">
                <div class="score-item" id="homeScore">0</div>
                <span>:</span>
                <div class="score-item" id="awayScore">0</div>
            </div>

            <div class="team-block right">
                <div class="team-name" id="awayTeamName">Гости</div>
                <div class="logo-container">
                    <img id="awayLogoImg" src="" style="display:none;">
                    <span id="awayLogoText" style="font-size:9px;color:#aaa;">Лого</span>
                </div>
            </div>
        </div>

        <div class="stats-container" id="statsContainer">
            <div class="stat-row">
                <div class="stat-home" id="stat_shots_home">0</div>
                <div class="stat-label">Удары</div>
                <div class="stat-away" id="stat_shots_away">0</div>
            </div>
            <div class="stat-row">
                <div class="stat-home" id="stat_fouls_home">0</div>
                <div class="stat-label">Нарушения</div>
                <div class="stat-away" id="stat_fouls_away">0</div>
            </div>
            <div class="stat-row">
                <div class="stat-home" id="stat_offsides_home">0</div>
                <div class="stat-label">Оффсайды</div>
                <div class="stat-away" id="stat_offsides_away">0</div>
            </div>
            <div class="stat-row">
                <div class="stat-home" id="stat_corners_home">0</div>
                <div class="stat-label">Угловые</div>
                <div class="stat-away" id="stat_corners_away">0</div>
            </div>
            <div class="stat-row">
                <div class="stat-home" id="stat_yellowCards_home">0</div>
                <div class="stat-label">Жёлтые</div>
                <div class="stat-away" id="stat_yellowCards_away">0</div>
            </div>
            <div class="stat-row">
                <div class="stat-home" id="stat_redCards_home">0</div>
                <div class="stat-label">Красные</div>
                <div class="stat-away" id="stat_redCards_away">0</div>
            </div>
        </div>

        <div class="possession-block">
            <div class="possession-label">Владение мячом</div>
            <div class="possession-labels">
                <span class="home" id="possHomeVal">50%</span>
                <span class="away" id="possAwayVal">50%</span>
            </div>
            <div class="possession-bar">
                <div class="possession-home" id="possHomeBar" style="width:50%"></div>
                <div class="possession-away" id="possAwayBar" style="width:50%"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCxRWPH50Jl-K290hLikKZAA41qeuP8s9c",
            authDomain: "stat-remote.firebaseapp.com",
            databaseURL: "https://stat-remote-default-rtdb.firebaseio.com",
            projectId: "stat-remote",
            storageBucket: "stat-remote.firebasestorage.app",
            messagingSenderId: "702880337194",
            appId: "1:702880337194:web:fc1b4db5fdfbbdb9416253",
            measurementId: "G-7S554X0ZVQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const matchRef = ref(db, 'match');

        let previousState = {};

        matchRef.on('value', (snapshot) => {
            const data = snapshot.val();
            const statKeys = ['shots', 'fouls', 'offsides', 'corners', 'yellowCards', 'redCards'];

            if (!data) {
                document.getElementById('homeTeamName').textContent = 'Хозяева';
                document.getElementById('awayTeamName').textContent = 'Гости';
                document.getElementById('homeLogoImg').style.display = 'none';
                document.getElementById('homeLogoText').style.display = 'block';
                document.getElementById('awayLogoImg').style.display = 'none';
                document.getElementById('awayLogoText').style.display = 'block';
                document.getElementById('homeScore').textContent = '0';
                document.getElementById('awayScore').textContent = '0';
                document.getElementById('possHomeVal').textContent = '50%';
                document.getElementById('possAwayVal').textContent = '50%';
                document.getElementById('possHomeBar').style.width = '50%';
                document.getElementById('possAwayBar').style.width = '50%';
                
                statKeys.forEach(key => {
                    document.getElementById(`stat_${key}_home`).textContent = '0';
                    document.getElementById(`stat_${key}_away`).textContent = '0';
                });
                previousState = {};
                return;
            }

            if (data.homeTeam !== undefined) document.getElementById('homeTeamName').textContent = data.homeTeam || 'Хозяева';
            if (data.awayTeam !== undefined) document.getElementById('awayTeamName').textContent = data.awayTeam || 'Гости';

            if (data.homeLogo !== undefined) {
                const img = document.getElementById('homeLogoImg');
                const txt = document.getElementById('homeLogoText');
                if (data.homeLogo) { img.src = data.homeLogo; img.style.display = 'block'; txt.style.display = 'none'; } 
                else { img.style.display = 'none'; txt.style.display = 'block'; img.src = ''; }
            }
            if (data.awayLogo !== undefined) {
                const img = document.getElementById('awayLogoImg');
                const txt = document.getElementById('awayLogoText');
                if (data.awayLogo) { img.src = data.awayLogo; img.style.display = 'block'; txt.style.display = 'none'; } 
                else { img.style.display = 'none'; txt.style.display = 'block'; img.src = ''; }
            }

            if (data.homeScore !== undefined) {
                const el = document.getElementById('homeScore');
                const oldVal = previousState.homeScore || 0;
                el.textContent = data.homeScore;
                if (data.homeScore > oldVal) {
                    el.classList.add('goal-flash');
                    setTimeout(() => el.classList.remove('goal-flash'), 1600);
                }
            }
            if (data.awayScore !== undefined) {
                const el = document.getElementById('awayScore');
                const oldVal = previousState.awayScore || 0;
                el.textContent = data.awayScore;
                if (data.awayScore > oldVal) {
                    el.classList.add('goal-flash');
                    setTimeout(() => el.classList.remove('goal-flash'), 1600);
                }
            }

            if (data.stats) {
                statKeys.forEach(key => {
                    const homeEl = document.getElementById(`stat_${key}_home`);
                    const awayEl = document.getElementById(`stat_${key}_away`);
                    
                    // ВЕРНУЛИ ЧТЕНИЕ ИЗ ПЕРВОЙ РАБОЧЕЙ СТРУКТУРЫ: match/stats/{team}/{stat}
                    const homeVal = data.stats.home?.[key] || 0;
                    const awayVal = data.stats.away?.[key] || 0;
                    const oldHome = previousState.stats?.home?.[key] || 0;
                    const oldAway = previousState.stats?.away?.[key] || 0;

                    if (homeEl) {
                        homeEl.textContent = homeVal;
                        if (homeVal > oldHome) {
                            homeEl.classList.add('stat-value-changed');
                            setTimeout(() => homeEl.classList.remove('stat-value-changed'), 500);
                        }
                    }
                    if (awayEl) {
                        awayEl.textContent = awayVal;
                        if (awayVal > oldAway) {
                            awayEl.classList.add('stat-value-changed');
                            setTimeout(() => awayEl.classList.remove('stat-value-changed'), 500);
                        }
                    }
                });
            } else {
                statKeys.forEach(key => {
                    document.getElementById(`stat_${key}_home`).textContent = '0';
                    document.getElementById(`stat_${key}_away`).textContent = '0';
                });
            }

            if (data.possession) {
                const home = data.possession.home || 50;
                const away = data.possession.away || 50;
                document.getElementById('possHomeVal').textContent = home + '%';
                document.getElementById('possAwayVal').textContent = away + '%';
                document.getElementById('possHomeBar').style.width = home + '%';
                document.getElementById('possAwayBar').style.width = away + '%';
            }

            previousState = JSON.parse(JSON.stringify(data));
        });

        const connectedRef = ref(db, '.info/connected');
        onValue(connectedRef, (snap) => {
            const dot = document.getElementById('statusDot');
            if (snap.val() === true) dot.classList.remove('disconnected');
            else dot.classList.add('disconnected');
        });
    </script>
</body>
</html>
