<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Overlay</title>
    <style>
        body { margin: 0; padding: 0; background-color: transparent; font-family: 'Roboto', Arial, sans-serif; overflow: hidden; }
        .scoreboard {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            display: flex;
            gap: 40px;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }
        .team { display: flex; flex-direction: column; align-items: center; min-width: 150px; }
        .team-name { font-size: 24px; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 20px; font-size: 16px; }
        .stat-item { display: flex; justify-content: space-between; gap: 15px; }
        .stat-val { font-weight: bold; color: #ffcc00; }
        .vs { font-size: 20px; color: #aaa; align-self: center; }
    </style>
</head>
<body>
    <div class="scoreboard">
        <div class="team">
            <div class="team-name" id="homeName">Команда 1</div>
            <div class="stats-grid" id="homeStats"></div>
        </div>
        <div class="vs">VS</div>
        <div class="team">
            <div class="team-name" id="awayName">Команда 2</div>
            <div class="stats-grid" id="awayStats"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCxRWPH50Jl-K290hLikKZAA41qeuP8s9c",
            authDomain: "stat-remote.firebaseapp.com",
            databaseURL: "https://stat-remote-default-rtdb.firebaseio.com",
            projectId: "stat-remote",
            storageBucket: "stat-remote.firebasestorage.app",
            messagingSenderId: "702880337194",
            appId: "1:702880337194:web:fc1b4db5fdfbbdb9416253",
            measurementId: "G-7S554X0ZVQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const statsConfig = [
            { key: 'shots', label: 'Удары' },
            { key: 'fouls', label: 'Фолы' },
            { key: 'offsides', label: 'Оффсайды' },
            { key: 'corners', label: 'Угловые' },
            { key: 'yellowCards', label: 'Ж.К' },
            { key: 'redCards', label: 'К.К' }
        ];

        const homeStatsDiv = document.getElementById('homeStats');
        const awayStatsDiv = document.getElementById('awayStats');

        // Создаем пустые ячейки для статистики
        statsConfig.forEach(stat => {
            homeStatsDiv.innerHTML += `<div class="stat-item"><span>${stat.label}</span> <span class="stat-val" id="home-${stat.key}">0</span></div>`;
            awayStatsDiv.innerHTML += `<div class="stat-item"><span class="stat-val" id="away-${stat.key}">0</span> <span>${stat.label}</span></div>`;
        });

        // Слушатель Firebase
        const matchRef = ref(db, 'match');
        onValue(matchRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            if (data.teams) {
                document.getElementById('homeName').innerText = data.teams.homeName || 'Команда 1';
                document.getElementById('awayName').innerText = data.teams.awayName || 'Команда 2';
            }

            if (data.stats) {
                statsConfig.forEach(stat => {
                    document.getElementById(`home-${stat.key}`).innerText = data.stats.home?.[stat.key] || 0;
                    document.getElementById(`away-${stat.key}`).innerText = data.stats.away?.[stat.key] || 0;
                });
            }
        });
    </script>
</body>
</html>
